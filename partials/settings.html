<div class="settings-container">
  <button id="settings-button" onclick="openSettings()" aria-label="Öppna inställningar" title="Öppna inställningar">
    <i class="fa fa-cog" aria-hidden="true"></i>
  </button>
  <div id="settings-options" class="hide">
    <button id="reading-mode-button" onclick="toggleReadingMode()" aria-label="Växla läsläge" title="Växla läsläge">
      <i class="fa fa-adjust" aria-hidden="true"></i>
    </button>
    <button id="dark-mode-button" onclick="toggleDarkMode()" aria-label="Växla mörkt läge" title="Växla mörkt läge">
      <i class="fa fa-moon" aria-hidden="true"></i>
    </button>
  </div>
</div>
